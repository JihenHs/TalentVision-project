name: CI/CD Pipeline - TalentVision

on:
  push:
    branches:
      - main
      - develop
      - full-project
  pull_request:
    branches:
      - main
      - develop
      - full-project

env:
  DOCKER_IMAGE_BACK: ${{ secrets.DOCKERHUB_USERNAME }}/talentvision-backend
  DOCKER_IMAGE_FRONT: ${{ secrets.DOCKERHUB_USERNAME }}/talentvision-frontend
  K8S_NAMESPACE: default

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: talentvision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ---- Backend ----
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd Backend/TalentVision_Back
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        run: |
          cd Backend/TalentVision_Back
          python manage.py test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: secret
          DB_NAME: talentvision_test
          SECRET_KEY: test-secret-key
          DEBUG: 'False'

      # ---- Frontend ----
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd Frontend/TalentVision_front
          npm ci

      - name: Run frontend tests
        run: |
          cd Frontend/TalentVision_front
          npx vitest run --coverage

  docker-and-k8s-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ---- Docker Hub login ----
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- Build & push backend image (latest + sha) ----
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/TalentVision_Back
          file: ./Backend/TalentVision_Back/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_BACK }}:latest
            ${{ env.DOCKER_IMAGE_BACK }}:${{ github.sha }}

      # ---- Build & push frontend image (latest + sha) ----
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend/TalentVision_front
          file: ./Frontend/TalentVision_front/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_FRONT }}:latest
            ${{ env.DOCKER_IMAGE_FRONT }}:${{ github.sha }}

      # ---- Install kubectl ----
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # ---- Configure kubeconfig from secret ----
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # ---- Apply manifests and update deployments to use the new images ----
      - name: Deploy to Kubernetes
        run: |
          # Apply manifests (creates deployments/service if absent)
          kubectl --namespace=${{ env.K8S_NAMESPACE }} apply -f kubernetes/deployment.yaml
          kubectl --namespace=${{ env.K8S_NAMESPACE }} apply -f kubernetes/service.yaml

          # Set images to the version tagged with the commit SHA (traceable)
          kubectl --namespace=${{ env.K8S_NAMESPACE }} set image deployment/talentvision-backend backend=${{ env.DOCKER_IMAGE_BACK }}:${{ github.sha }} --record || true
          kubectl --namespace=${{ env.K8S_NAMESPACE }} set image deployment/talentvision-frontend frontend=${{ env.DOCKER_IMAGE_FRONT }}:${{ github.sha }} --record || true

          # Watch rollout status
          kubectl --namespace=${{ env.K8S_NAMESPACE }} rollout status deployment/talentvision-backend --timeout=120s || true
          kubectl --namespace=${{ env.K8S_NAMESPACE }} rollout status deployment/talentvision-frontend --timeout=120s || true

          # Liste des pods pour debug rapide
          kubectl get pods --namespace=${{ env.K8S_NAMESPACE }}
