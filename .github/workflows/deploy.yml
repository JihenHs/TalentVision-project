name: CI/CD Pipeline - TalentVision

on:
  push:
    branches:
      - main
      - develop
      - full-project
  pull_request:
    branches:
      - main
      - develop
      - full-project

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: talentvision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ---- Backend ----
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd Backend/TalentVision_Back
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        run: |
          cd Backend/TalentVision_Back
          python manage.py test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: secret
          DB_NAME: talentvision_test
          SECRET_KEY: test-secret-key
          DEBUG: 'False'

      # ---- Frontend ----
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd Frontend/TalentVision_front
          npm ci

      - name: Run frontend tests
        run: |
          cd Frontend/TalentVision_front
          npx vitest run --coverage

  docker-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔹 Docker Hub login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🔹 Build & push backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/TalentVision_Back
          file: ./Backend/TalentVision_Back/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/talentvision-backend:latest

      # 🔹 Build & push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend/TalentVision_front
          file: ./Frontend/TalentVision_front/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/talentvision-frontend:latest

      # 🔹 Installer Railway CLI
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # 🔹 Déployer le backend sur Railway
      # Déployer le backend
      - name: Deploy Backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service ${{ secrets.RAILWAY_BACKEND_ID }} --detach --no-verify

        # Déployer le frontend
      - name: Deploy Frontend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service ${{ secrets.RAILWAY_FRONTEND_ID }} --detach --no-verify
