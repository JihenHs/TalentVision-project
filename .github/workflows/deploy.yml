name: CI/CD Pipeline - TalentVision

on:
  push:
    branches:
      - main
      - develop
      - full-project
  pull_request:
    branches:
      - main
      - develop
      - full-project

env:
  DOCKER_IMAGE_BACK: ${{ secrets.DOCKERHUB_USERNAME }}/talentvision-backend
  DOCKER_IMAGE_FRONT: ${{ secrets.DOCKERHUB_USERNAME }}/talentvision-frontend
  K8S_NAMESPACE: default

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talentvision_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd Backend/TalentVision_Back
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          cd Backend/TalentVision_Back
          python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: TalentVision_Back.settings
          USE_POSTGRES: 'True'
          DB_NAME: talentvision_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: test-secret-key
          DEBUG: 'False'

      - name: Run backend tests
        run: |
          cd Backend/TalentVision_Back
          pytest --cov=recruitment --cov=accounts --cov=ai_engine --cov-report=xml --cov-report=term
        env:
          DJANGO_SETTINGS_MODULE: TalentVision_Back.settings
          USE_POSTGRES: 'True'
          DB_NAME: talentvision_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: test-secret-key
          DEBUG: 'False'

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./Backend/TalentVision_Back/coverage.xml
          flags: backend

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/TalentVision_front/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd Frontend/TalentVision_front
          npm ci

      - name: Run frontend tests
        run: |
          cd Frontend/TalentVision_front
          npm test -- --coverage --reporter=verbose

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./Frontend/TalentVision_front/coverage/coverage-final.json
          flags: frontend

  docker-hub-deploy:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/TalentVision_Back
          file: ./Backend/TalentVision_Back/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_BACK }}:latest
            ${{ env.DOCKER_IMAGE_BACK }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend/TalentVision_front
          file: ./Frontend/TalentVision_front/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_FRONT }}:latest
            ${{ env.DOCKER_IMAGE_FRONT }}:${{ github.sha }}

  kubernetes-deploy:
    needs: docker-hub-deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.28.2

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml

      - name: Update images in deployment
        run: |
          kubectl set image deployment/talentvision-backend backend=${{ env.DOCKER_IMAGE_BACK }}:latest --namespace=default
          kubectl set image deployment/talentvision-frontend frontend=${{ env.DOCKER_IMAGE_FRONT }}:latest --namespace=default
