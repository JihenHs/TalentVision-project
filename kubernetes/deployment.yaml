# --------------------------
# Déploiement PostgreSQL
# --------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talentvision-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talentvision-db
  template:
    metadata:
      labels:
        app: talentvision-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_DB
              value: talentvision
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: talentvision-db
spec:
  selector:
    app: talentvision-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP

# --------------------------
# Backend (ajout des variables DB)
# --------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talentvision-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talentvision-backend
  template:
    metadata:
      labels:
        app: talentvision-backend
    spec:
      containers:
        - name: backend
          image: talentvision-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: talentvision-db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: talentvision
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              value: secret

# --------------------------
# Frontend
# --------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talentvision-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talentvision-frontend
  template:
    metadata:
      labels:
        app: talentvision-frontend
    spec:
      containers:
        - name: frontend
          image: talentvision-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
