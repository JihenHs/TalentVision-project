apiVersion: v1
kind: Service
metadata:
  name: talentvision-backend-svc
spec:
  type: ClusterIP
  selector:
    app: talentvision-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: talentvision-frontend-svc
spec:
  type: NodePort
  selector:
    app: talentvision-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
